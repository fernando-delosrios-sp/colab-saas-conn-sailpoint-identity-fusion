schema: ferspec
context: |
  Tech stack: TypeScript, Node.js
  Package manager: npm
  Project: colab-saas-conn-sailpoint-identity-fusion
rules:
  global:
    - "Always use the `changelog-generator` skill to maintain and enforce a changelog for all changes."
  discovery: []
  proposal: []
  design:
    - Use C4 diagram logic for architecture when appropriate
  specs:
    - Write clear Acceptance Criteria following Gherkin format where applicable
  tasks:
    - Keep tasks small, independent, and verifiable
operations:
  archive:
    guidance:
      - "Archive is incomplete until synced specs and the moved change folder are committed. The built-in /opsx:archive workflow syncs and moves but does NOT commit."
      - "After sync and archive move: run git status --porcelain. If non-empty, stage openspec/specs/ and openspec/changes/ (plus any paths touched during sync), then invoke git-commit via Skill tool with change name and archive context."
      - "Fallback when git-commit skill is absent: conventional commit manually, e.g. docs(openspec): archive <change-name> and sync specs — do not skip when porcelain is non-empty."
      - "Post-commit gate (blocking): git status --porcelain must be empty; when the change is under openspec/changes/archive/, confirm the latest commit includes synced specs and the archive folder via git log -1 --name-only -- openspec/specs/ openspec/changes/archive/."
      - "Do not report archive complete until the post-commit gate passes."
  apply:
    guidance:
      - "Apply is incomplete until /opsx:verify reports empty CRITICAL, WARNING, and SUGGESTION tiers on the verification ref."
      - "All tasks checked off is not handoff — run verify as the blocking last gate before reporting apply complete."
      - "Fix every verify issue autonomously; repeat until all three tiers are empty, then run a confirmation scorecard pass (scorecard-only — no new hunting)."
      - "Apply owns delta spec reconciliation: when shipped behavior diverges from a scenario, rewrite its title and steps together and delete superseded scenarios in the change's own specs/**. Spec sync into openspec/specs/ stays archive-only."
      - "A verify finding that recommends a later phase (e.g. 'before archive, rename or drop those leftover titles') is still apply's to fix when the fix lives inside the change directory."
      - "Worktree venue: squash apply-<name> to ORIGINAL_BRANCH on main repo before verify."
      - "Do not report apply complete while any verify tier still has issues."
