site_name: Identity Fusion NG Documentation
site_description: Identity Fusion NG usage guides and operations reference
site_url: https://fernando.delosrios-sp.github.io/colab-saas-conn-sailpoint-identity-fusion/
repo_url: https://github.com/fernando-delosrios-sp/colab-saas-conn-sailpoint-identity-fusion
edit_uri: edit/2.2.0/preview/docs/
site_dir: site
docs_dir: docs
exclude_docs: README.md

theme:
    name: material
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.sections
        - navigation.expand
        - navigation.top
        - search.suggest
        - search.highlight
        - content.code.copy
        - content.action.edit
        - toc.follow
    icon:
        edit: material/pencil

nav:
    - Home: index.md
    - Use guides:
          - Use guides overview: use-guides/index.md
          - Getting started:
                - Overview: getting-started/overview.md
                - First aggregation: getting-started/first-aggregation.md
                - Which guide do I need?: getting-started/which-guide.md
          - Configuration guides:
                - Configuring sources and scope: use-guides/configuration/configuring-sources-and-scope.md
                - Source types: use-guides/configuration/source-types.md
                - Mapping attributes: use-guides/configuration/mapping-attributes.md
                - Defining attributes: use-guides/configuration/defining-attributes.md
                - Matching identities: use-guides/configuration/matching-identities.md
                - Managing correlation: use-guides/configuration/managing-correlation.md
                - Managing reviewers: use-guides/configuration/managing-reviewers.md
                - Review forms and reviewers: use-guides/configuration/review-forms-and-reviewers.md
                - Tuning matching algorithms: use-guides/configuration/tuning-matching-algorithms.md
                - Match tuning cookbooks: use-guides/configuration/match-tuning-cookbooks.md
    - Configuration:
          - Configuration reference: configuration/index.md
          - Connection Settings: configuration/connection.md
          - Source Settings: configuration/source.md
          - Attribute Mapping Settings: configuration/mapping.md
          - Attribute Definition Settings: configuration/definition.md
          - Attribute Matching Settings: configuration/matching.md
          - Advanced Settings: configuration/advanced.md
          - Operation guides:
                - Dry-run analysis: use-guides/operation/dry-run-analysis.md
                - Connection and observability tuning: use-guides/operation/connection-and-observability-tuning.md
          - Validation and troubleshooting guides:
                - Testing and validation: use-guides/validation-and-troubleshooting/testing-and-validation.md
                - Troubleshooting: use-guides/validation-and-troubleshooting/troubleshooting.md
          - Deployment guides:
                - Migrating from Identity Fusion v1: use-guides/deployment/migrating-from-identity-fusion-v1.md
    - Glossary: glossary.md
    - Technical reference:
          - Standard account schema: reference/standard-account-schema.md
          - Velocity context: reference/velocity-context.md
          - ISC PAT scopes: reference/pat-scopes.md
          - Observability: reference/observability.md
          - Proxy deployment: reference/proxy-mode.md
          - Scenario recording: reference/scenario-recording.md
          - Configuration to account-list phases: reference/config-to-phases.md
          - Connector operations:
                - Connector operations (APIs ISC calls): operations/index.md
                - Connectivity:
                      - Test connection: operations/test-connection.md
                      - Dry-run mode: operations/dry-run.md
                - Schema and reads:
                      - Account discover schema: operations/account-discover-schema.md
                      - Account list: operations/account-list.md
                      - Account read: operations/account-read.md
                - Account lifecycle:
                      - Account create: operations/account-create.md
                      - Account update: operations/account-update.md
                      - Account enable: operations/account-enable.md
                      - Account disable: operations/account-disable.md
                - Entitlements:
                      - Entitlement list: operations/entitlement-list.md

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format






